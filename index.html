<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lettore CF</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#fff}main{max-width:720px;margin:auto;padding:20px}p{color:#cbd5e1}.scanner{position:relative;overflow:hidden;border-radius:18px;background:#000;aspect-ratio:3/4;margin:18px 0}video{width:100%;height:100%;object-fit:cover}.guide{position:absolute;left:5%;right:5%;top:38%;height:22%;border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 9999px #0007}.guide:after{content:"Inquadra il barcode";position:absolute;bottom:-34px;width:100%;text-align:center;font-weight:700}button{border:0;border-radius:12px;padding:14px;font-size:1rem;font-weight:700;width:100%}.result{background:#111827;border:1px solid #334155;border-radius:14px;padding:16px;margin-top:14px}.cf{font:800 1.3rem monospace;letter-spacing:.05em;word-break:break-all}.ok{color:#86efac}.bad{color:#fca5a5}</style></head><body><main><h1>Lettore Codice Fiscale</h1><p>Inquadra il barcode Code 39 della tessera. L'elaborazione avviene sul dispositivo.</p><button id="start">Avvia fotocamera</button><div class="scanner" hidden id="box"><video id="video" playsinline muted></video><div class="guide"></div></div><div class="result"><div>Risultato</div><div class="cf" id="out">—</div><div id="status">Fotocamera non avviata.</div></div></main><script>
const $=s=>document.querySelector(s),start=$('#start'),video=$('#video'),box=$('#box'),out=$('#out'),status=$('#status');let detector,running=false;
const cf=/^[A-Z]{6}[0-9LMNPQRSTUV]{2}[ABCDEHLMPRST][0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{3}[A-Z]$/;
const clean=s=>(s||'').toUpperCase().replace(/^\*|\*$/g,'').replace(/\s/g,'');
async function scan(){if(!running)return;try{for(const b of await detector.detect(video)){const v=clean(b.rawValue);if(!v)continue;out.textContent=v;if(cf.test(v)){status.textContent='Codice fiscale letto.';status.className='ok';navigator.vibrate?.(100);running=false;return}status.textContent='Barcode rilevato, ma non sembra un codice fiscale.';status.className='bad'}}catch{}requestAnimationFrame(scan)}
start.onclick=async()=>{try{if(!window.isSecureContext)throw Error('La pagina deve essere aperta via HTTPS.');if(!navigator.mediaDevices?.getUserMedia)throw Error('Fotocamera non disponibile.');if(!('BarcodeDetector'in window))throw Error('Questo browser non supporta BarcodeDetector.');const f=await BarcodeDetector.getSupportedFormats();if(!f.includes('code_39'))throw Error('Questo browser non supporta Code 39.');detector=new BarcodeDetector({formats:['code_39']});const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});video.srcObject=stream;await video.play();box.hidden=false;start.hidden=true;running=true;status.textContent='Inquadra il barcode.';scan()}catch(e){status.textContent=e.message;status.className='bad'}};
</script></body></html>
