document.querySelector('#copyAll').onclick=async()=>{let q=sb.from('scansioni').select('codice_fiscale,data,nome,cognome,data_nascita').order('created_at',{ascending:false});const from=$('#filterFrom').value,to=$('#filterTo').value;if(from)q=q.gte('data',from);if(to)q=q.lte('data',to);const {data}=await q;if(data)await navigator.clipboard.writeText(data.map(x=>formatDate(x.data)+'\t'+(x.cognome||'')+'\t'+(x.nome||'')+'\t'+formatDate(x.data_nascita)+'\t'+x.codice_fiscale).join('\n'))};
const today=()=>{const d=new Date(),o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,10)};receiptDate.value=today();const formatDate=v=>{if(!v)return '';const [y,m,d]=v.split('-');return d+'/'+m+'/'+y};
const cf=/^[A-Z]{6}[0-9LMNPQRSTUV]{2}[ABCDEHLMPRST][0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{3}[A-Z]$/;

function validCF(v){v=clean(v);if(!cf.test(v))return false;let s=0;for(let i=0;i<15;i++)s+=(i%2===0?cfOdd:cfEven)[v[i]];return String.fromCharCode(65+s%26)===v[15]}
function cfBirthMatches(v,iso){if(!validCF(v)||!iso)return false;const [y,m,d]=iso.split('-').map(Number),months='ABCDEHLMPRST',cm=months.indexOf(v[8])+1;let cd=parseInt(v.slice(9,11).replace(/[LMNPQRSTUV]/g,ch=>String('LMNPQRSTUV'.indexOf(ch))),10);if(cd>40)cd-=40;return cm===m&&cd===d&&String(y).slice(-2)===v.slice(6,8).replace(/[LMNPQRSTUV]/g,ch=>String('LMNPQRSTUV'.indexOf(ch)))}
const clean=s=>(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');const findCF=s=>{const v=clean(s);const re=/[A-Z]{6}[0-9LMNPQRSTUV]{2}[ABCDEHLMPRST][0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{3}[A-Z]/;const m=v.match(re);return m?m[0]:''};
async function scan(){if(!running)return;try{for(const b of await detector.detect(video)){const raw=clean(b.rawValue);if(!raw)continue;const v=findCF(raw);out.textContent=v||raw;if(v&&cf.test(v)){currentCF=v;cfInput.value=v;running=false;if(video.srcObject){video.srcObject.getTracks().forEach(t=>t.stop());video.srcObject=null}box.hidden=true;start.hidden=true;status.textContent='Codice fiscale acquisito. Scansione interrotta.';status.className='ok';pdfBtn.disabled=false;printBtn.disabled=false;again.disabled=false;saveBtn.disabled=false;navigator.vibrate?.(100);return}status.textContent='Barcode rilevato, ma non sembra un codice fiscale.';status.className='bad'}}catch(e){status.textContent='Errore scansione: '+e.message;status.className='bad'}if(running)requestAnimationFrame(scan)}
start.onclick=async()=>{try{if(!window.isSecureContext)throw Error('La pagina deve essere aperta via HTTPS.');if(!navigator.mediaDevices?.getUserMedia)throw Error('Fotocamera non disponibile.');if(!('BarcodeDetector'in window))throw Error('Questo browser non supporta BarcodeDetector.');const f=await BarcodeDetector.getSupportedFormats();if(!f.includes('code_39'))throw Error('Questo browser non supporta Code 39.');detector=new BarcodeDetector({formats:['code_39']});const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});video.srcObject=stream;await video.play();box.hidden=false;start.hidden=true;running=true;status.textContent='Inquadra il barcode.';scan()}catch(e){status.textContent=e.message;status.className='bad'}};
async function printable(){if(!currentCF)return;const w=window.open('','_blank');if(!w){status.textContent='Il browser ha bloccato la finestra di stampa.';status.className='bad';return}try{const r=await fetch('template.svg',{cache:'no-store'});if(!r.ok)throw Error('Template non disponibile');let svg=await r.text();const dateText=formatDate(receiptDate.value);svg=svg.replace('</svg>','<text x="360" y="815" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="600" fill="#111">'+dateText+'</text><text x="825" y="570" text-anchor="middle" font-family="monospace" font-size="27" font-weight="700" letter-spacing="1.5" fill="#111">'+currentCF+'</text></svg>');const data='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);w.document.open();w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Ricevuta</title><style>@page{size:A4 landscape;margin:0}html,body{margin:0;background:#fff;width:100%;height:100%}img{display:block;width:297mm;height:167.1mm;object-fit:contain}</style></head><body><img id="receipt" src="'+data+'"><script>const i=document.getElementById("receipt");function go(){setTimeout(()=>window.print(),500)}if(i.complete)go();else i.onload=go;<\/script></body></html>');w.document.close()}catch(e){w.close();status.textContent='Errore PDF: '+e.message;status.className='bad'}}pdfBtn.onclick=printable;printBtn.onclick=printable;cfInput.oninput=()=>{currentCF=clean(cfInput.value);out.textContent=currentCF||'—';const valid=validCF(currentCF);saveBtn.disabled=!valid;pdfBtn.disabled=!valid;printBtn.disabled=!valid;again.disabled=!valid};document.querySelector('#docPhoto').onclick=()=>docFile.click();
function dateISO(s){const m=(s||'').match(/(\d{2})[\.\/\-](\d{2})[\.\/\-](\d{4})/);return m?m[3]+'-'+m[2]+'-'+m[1]:''}
const mrzVal=ch=>{if(/[0-9]/.test(ch))return +ch;if(/[A-Z]/.test(ch))return ch.charCodeAt(0)-55;return 0};
function mrzCheck(s,cd){const w=[7,3,1];return s.split('').reduce((n,ch,i)=>n+mrzVal(ch)*w[i%3],0)%10===+cd}

function parseMRZ(text){const ls=text.toUpperCase().split(/\n/).map(normMRZ).filter(x=>x.length>=27&&x.includes('<'));for(let i=0;i<ls.length-2;i++){let l1=ls[i],l2=ls[i+1],l3=ls[i+2];if(l1.length<30||l2.length<30||l3.length<30)continue;l1=l1.slice(0,30);l2=l2.slice(0,30);l3=l3.slice(0,30);const birth=l2.slice(0,6).replace(/[OQ]/g,'0'),birthCD=l2[6];if(!/^\d{6}$/.test(birth)||!/^\d$/.test(birthCD)||!mrzCheck(birth,birthCD))continue;const doc=l1.slice(5,14),docCD=l1[14];if(/^\d$/.test(docCD)&&!mrzCheck(doc,docCD))continue;const parts=l3.split('<<');if(parts.length<2)continue;const sur=parts[0].replace(/</g,' ').replace(/\s+/g,' ').trim(),giv=parts.slice(1).join(' ').replace(/</g,' ').replace(/\s+/g,' ').trim();if(sur.length<2||giv.length<2)continue;const yy=+birth.slice(0,2),mm=+birth.slice(2,4),dd=+birth.slice(4,6),now=new Date().getFullYear()%100,yyyy=(yy>now?1900:2000)+yy;if(mm<1||mm>12||dd<1||dd>31)continue;return{cognome:sur,nome:giv,data:String(yyyy)+'-'+String(mm).padStart(2,'0')+'-'+String(dd).padStart(2,'0')}}return null}
function parsePrinted(text){const t=text.toUpperCase().replace(/\r/g,'');const lines=t.split('\n').map(x=>x.trim()).filter(Boolean);const after=label=>{for(let i=0;i<lines.length;i++)if(lines[i].includes(label)){let v=lines[i].replace(new RegExp('.*'+label+'\\s*[:\\-]?\\s*'),'').trim();if(v&&v!==label)return v;if(lines[i+1])return lines[i+1].trim()}return''};return{nome:after('NOME'),cognome:after('COGNOME'),data:dateISO(after('NASCITA')||after('NATO')||after('NATA')),cf:findCF(t)}}
async function makeCrop(file,top,bottom,threshold=150){const img=await createImageBitmap(file),sy=Math.floor(img.height*top),sh=Math.max(1,Math.floor(img.height*(bottom-top))),cv=document.createElement('canvas'),ctx=cv.getContext('2d',{willReadFrequently:true}),scale=Math.max(1.5,1800/img.width);cv.width=Math.round(img.width*scale);cv.height=Math.round(sh*scale);ctx.drawImage(img,0,sy,img.width,sh,0,0,cv.width,cv.height);const d=ctx.getImageData(0,0,cv.width,cv.height);for(let i=0;i<d.data.length;i+=4){const g=.299*d.data[i]+.587*d.data[i+1]+.114*d.data[i+2],v=g>threshold?255:0;d.data[i]=d.data[i+1]=d.data[i+2]=v}ctx.putImageData(d,0,0);return cv}
async function makeMRZCrop(file){return makeCrop(file,.55,1,.62*255)}
docFile.onchange=async()=>{const file=docFile.files[0];if(!file)return;status.textContent='Analisi locale: preparazione immagine…';status.className='';document.querySelector('#docPhoto').disabled=true;let worker;try{worker=await Tesseract.createWorker('ita',1,{logger:m=>{if(m.status==='recognizing text')status.textContent='Analisi locale del documento… '+Math.round((m.progress||0)*100)+'%'}});await worker.setParameters({tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789<'});const mrzCrop=await makeMRZCrop(file);const mrzRes=await worker.recognize(mrzCrop,{rotateAuto:true});let mrz=parseMRZ(mrzRes.data.text);await worker.setParameters({tessedit_char_whitelist:''});status.textContent='Analisi locale: lettura zona anagrafica…';const upper=await makeCrop(file,.05,.55,175);const upperRes=await worker.recognize(upper,{rotateAuto:true});const full=await worker.recognize(file,{rotateAuto:true});const p=parsePrinted(upperRes.data.text+'\n'+full.data.text);if(!mrz)mrz=parseMRZ(full.data.text);const cleanName=x=>(x||'').replace(/[^A-ZÀ-ÖØ-Ý' -]/g,'').replace(/\s+/g,' ').trim();nome.value=cleanName(mrz?.nome||p.nome);cognome.value=cleanName(mrz?.cognome||p.cognome);birthDate.value=mrz?.data||p.data||'';const candidates=[findCF(upperRes.data.text),findCF(full.data.text)].filter(Boolean),found=candidates.find(validCF)||'';if(found){currentCF=found;cfInput.value=found;out.textContent=found}else{currentCF='';cfInput.value='';out.textContent='—'}const valid=validCF(currentCF);saveBtn.disabled=!valid;pdfBtn.disabled=!valid;printBtn.disabled=!valid;again.disabled=!valid;let notes=[];if(mrz)notes.push('MRZ con controlli superati');else notes.push('MRZ non confermata');if(found)notes.push('CF con carattere di controllo valido');else notes.push('CF non verificato');if(found&&birthDate.value)notes.push(cfBirthMatches(found,birthDate.value)?'CF e data compatibili':'ATTENZIONE: CF e data non coincidono');status.textContent=notes.join('. ')+'. Controlla nome e cognome prima di sal
