<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lettore CF</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#fff}main{max-width:720px;margin:auto;padding:20px}p{color:#cbd5e1}.scanner{position:relative;overflow:hidden;border-radius:18px;background:#000;aspect-ratio:3/4;margin:18px 0}video{width:100%;height:100%;object-fit:cover}.guide{position:absolute;left:5%;right:5%;top:38%;height:22%;border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 9999px #0007}.guide:after{content:"Inquadra il barcode";position:absolute;bottom:-34px;width:100%;text-align:center;font-weight:700}button{border:0;border-radius:12px;padding:14px;font-size:1rem;font-weight:700;width:100%}.result{background:#111827;border:1px solid #334155;border-radius:14px;padding:16px;margin-top:14px}.cf{font:800 1.3rem monospace;letter-spacing:.05em;word-break:break-all}.ok{color:#86efac}.bad{color:#fca5a5}button:disabled{opacity:.4}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.actions button:first-child{grid-column:1/-1}.archive-wrap{overflow-x:auto;margin-top:10px}.archive-table{width:100%;border-collapse:collapse;min-width:520px}.archive-table th,.archive-table td{padding:10px 8px;border-bottom:1px solid #334155;text-align:left}.archive-table th{color:#cbd5e1;font-size:.9rem}.archive-table td.cfcell{font-family:monospace;font-weight:700}.archive-table button{width:auto;padding:7px 10px;font-size:.9rem;margin-right:6px}.filters{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-top:12px;align-items:end}.filters input{width:100%;padding:9px;border-radius:8px;border:1px solid #64748b}.filters button{width:auto;padding:10px}.filters label{font-size:.85rem;color:#cbd5e1}@media(max-width:560px){.filters{grid-template-columns:1fr 1fr}.filters button{grid-column:1/-1;width:100%}}</style></head><body><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><main><h1>Lettore Codice Fiscale</h1><div id="auth" class="result"><b>Accesso archivio</b><input id="email" type="email" value="zantium@gmail.com" readonly style="width:100%;margin:10px 0;padding:12px"><input id="password" type="password" placeholder="Password" style="width:100%;margin-bottom:10px;padding:12px"><button id="login">Accedi</button><button id="logout" hidden>Esci</button><div id="authStatus"></div></div><div id="app" hidden><p>Inquadra il barcode Code 39 della tessera. L'elaborazione avviene sul dispositivo.</p><button id="start">Avvia fotocamera</button><div class="scanner" hidden id="box"><video id="video" playsinline muted></video><div class="guide"></div></div><div class="result"><div>Risultato</div><div class="cf" id="out">—</div><div id="status">Fotocamera non avviata.</div></div><div id="dateRow" style="margin-top:14px"><label for="receiptDate" style="display:block;margin-bottom:6px;font-weight:700">Data ricevuta</label><input id="receiptDate" type="date" style="width:100%;padding:13px;border-radius:10px;border:1px solid #64748b;font-size:1rem"></div><button id="save" disabled style="margin-top:14px">Salva scansione</button><div class="actions"><button id="again" disabled>Scansiona un altro CF</button><button id="pdf" disabled>Scarica PDF</button><button id="print" disabled>Stampa</button></div><div id="archive" class="result" hidden><b>Archivio scansioni</b><div class="filters"><label>Dal<input id="filterFrom" type="date"></label><label>Al<input id="filterTo" type="date"></label><button id="clearFilters">Azzera filtri</button></div><button id="copyAll" style="margin-top:10px">Copia tutti</button><div class="archive-wrap"><table class="archive-table"><thead><tr><th>Data</th><th>Codice fiscale</th><th>Azioni</th></tr></thead><tbody id="rows"></tbody></table></div></div></div></main><script>
const $=s=>document.querySelector(s),start=$('#start'),video=$('#video'),box=$('#box'),out=$('#out'),status=$('#status'),pdfBtn=$('#pdf'),printBtn=$('#print'),again=$('#again'),receiptDate=$('#receiptDate'),saveBtn=$('#save'),archive=$('#archive'),rows=$('#rows'),authStatus=$('#authStatus');let detector,running=false,currentCF='';
const sb=supabase.createClient('https://mkzkraflsaxcxbmqeuez.supabase.co','sb_publishable_5TtaI4N1wJYNcvOioEF4KQ_KrmCuRg_');
async function refreshArchive(){let q=sb.from('scansioni').select('id,codice_fiscale,data').order('created_at',{ascending:false});const from=$('#filterFrom')?.value,to=$('#filterTo')?.value;if(from)q=q.gte('data',from);if(to)q=q.lte('data',to);const {data,error}=await q;if(error){authStatus.textContent=error.message;return}rows.innerHTML=data.length?data.map(x=>'<tr><td>'+formatDate(x.data)+'</td><td class="cfcell">'+x.codice_fiscale+'</td><td><button onclick="navigator.clipboard.writeText(\''+x.codice_fiscale+'\')">Copia</button><button onclick="deleteScan('+x.id+')">Elimina</button></td></tr>').join(''):'<tr><td colspan="3">Nessuna scansione salvata.</td></tr>';archive.hidden=false}
async function deleteScan(id){if(!confirm('Eliminare questa scansione?'))return;const {error}=await sb.from('scansioni').delete().eq('id',id);if(error){authStatus.textContent='Errore eliminazione: '+error.message;return}refreshArchive()}
$('#filterFrom').onchange=refreshArchive;$('#filterTo').onchange=refreshArchive;$('#clearFilters').onclick=()=>{$('#filterFrom').value='';$('#filterTo').value='';refreshArchive()};
async function authUI(){const {data:{session}}=await sb.auth.getSession();const on=!!session;$('#app').hidden=!on;document.querySelector('#login').hidden=on;document.querySelector('#password').hidden=on;document.querySelector('#email').hidden=on;document.querySelector('#logout').hidden=!on;authStatus.textContent=on?'Archivio collegato come '+session.user.email:'Accedi per salvare e rileggere le scansioni.';if(on)refreshArchive();else archive.hidden=true}
document.querySelector('#login').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:document.querySelector('#email').value,password:document.querySelector('#password').value});authStatus.textContent=error?error.message:'Accesso effettuato.';authUI()};
document.querySelector('#logout').onclick=async()=>{await sb.auth.signOut();authUI()};
sb.auth.onAuthStateChange(()=>setTimeout(authUI,0));authUI();
saveBtn.onclick=async()=>{if(!currentCF)return;const {error}=await sb.from('scansioni').insert({codice_fiscale:currentCF,data:receiptDate.value});status.textContent=error?'Errore salvataggio: '+error.message:'Scansione salvata nell’archivio.';status.className=error?'bad':'ok';if(!error)refreshArchive()};
document.querySelector('#copyAll').onclick=async()=>{let q=sb.from('scansioni').select('codice_fiscale,data').order('created_at',{ascending:false});const from=$('#filterFrom').value,to=$('#filterTo').value;if(from)q=q.gte('data',from);if(to)q=q.lte('data',to);const {data}=await q;if(data)await navigator.clipboard.writeText(data.map(x=>formatDate(x.data)+'\t'+x.codice_fiscale).join('\n'))};
const today=()=>{const d=new Date(),o=d.getTimezoneOffset();return new Date(d.getTime()-o*60000).toISOString().slice(0,10)};receiptDate.value=today();const formatDate=v=>{if(!v)return '';const [y,m,d]=v.split('-');return d+'/'+m+'/'+y};
const cf=/^[A-Z]{6}[0-9LMNPQRSTUV]{2}[ABCDEHLMPRST][0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{3}[A-Z]$/;
const clean=s=>(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');const findCF=s=>{const v=clean(s);const re=/[A-Z]{6}[0-9LMNPQRSTUV]{2}[ABCDEHLMPRST][0-9LMNPQRSTUV]{2}[A-Z][0-9LMNPQRSTUV]{3}[A-Z]/;const m=v.match(re);return m?m[0]:''};
async function scan(){if(!running)return;try{for(const b of await detector.detect(video)){const raw=clean(b.rawValue);if(!raw)continue;const v=findCF(raw);out.textContent=v||raw;if(v&&cf.test(v)){currentCF=v;running=false;if(video.srcObject){video.srcObject.getTracks().forEach(t=>t.stop());video.srcObject=null}box.hidden=true;start.hidden=true;status.textContent='Codice fiscale acquisito. Scansione interrotta.';status.className='ok';pdfBtn.disabled=false;printBtn.disabled=false;again.disabled=false;saveBtn.disabled=false;navigator.vibrate?.(100);return}status.textContent='Barcode rilevato, ma non sembra un codice fiscale.';status.className='bad'}}catch(e){status.textContent='Errore scansione: '+e.message;status.className='bad'}if(running)requestAnimationFrame(scan)}
start.onclick=async()=>{try{if(!window.isSecureContext)throw Error('La pagina deve essere aperta via HTTPS.');if(!navigator.mediaDevices?.getUserMedia)throw Error('Fotocamera non disponibile.');if(!('BarcodeDetector'in window))throw Error('Questo browser non supporta BarcodeDetector.');const f=await BarcodeDetector.getSupportedFormats();if(!f.includes('code_39'))throw Error('Questo browser non supporta Code 39.');detector=new BarcodeDetector({formats:['code_39']});const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});video.srcObject=stream;await video.play();box.hidden=false;start.hidden=true;running=true;status.textContent='Inquadra il barcode.';scan()}catch(e){status.textContent=e.message;status.className='bad'}};
async function printable(){if(!currentCF)return;const w=window.open('','_blank');if(!w){status.textContent='Il browser ha bloccato la finestra di stampa.';status.className='bad';return}try{const r=await fetch('template.svg',{cache:'no-store'});if(!r.ok)throw Error('Template non disponibile');let svg=await r.text();const dateText=formatDate(receiptDate.value);svg=svg.replace('</svg>','<text x="360" y="815" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="600" fill="#111">'+dateText+'</text><text x="825" y="570" text-anchor="middle" font-family="monospace" font-size="27" font-weight="700" letter-spacing="1.5" fill="#111">'+currentCF+'</text></svg>');const data='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);w.document.open();w.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Ricevuta</title><style>@page{size:A4 landscape;margin:0}html,body{margin:0;background:#fff;width:100%;height:100%}img{display:block;width:297mm;height:167.1mm;object-fit:contain}</style></head><body><img id="receipt" src="'+data+'"><script>const i=document.getElementById("receipt");function go(){setTimeout(()=>window.print(),500)}if(i.complete)go();else i.onload=go;<\/script></body></html>');w.document.close()}catch(e){w.close();status.textContent='Errore PDF: '+e.message;status.className='bad'}}pdfBtn.onclick=printable;printBtn.onclick=printable;again.onclick=()=>{currentCF='';out.textContent='—';pdfBtn.disabled=true;printBtn.disabled=true;again.disabled=true;saveBtn.disabled=true;start.click()};</script></body></html>
